name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate release codename governance
        run: python scripts/release_codenames.py validate
      - name: Validate release manifests
        run: |
          for manifest in releases/v*.yaml; do
            python scripts/release_from_manifest.py "$manifest"
          done
      - name: Validate v1 release readiness
        run: python scripts/release_readiness.py
