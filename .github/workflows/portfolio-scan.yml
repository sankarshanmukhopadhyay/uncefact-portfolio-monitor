name: Portfolio scan and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  discover-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore previous portfolio state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: portfolio-baseline-${{ github.run_id }}
          restore-keys: |
            portfolio-baseline-
      - name: Discover UN/CEFACT projects
        run: python scripts/discover_portfolio.py
      - name: Compare with previous observation
        run: python scripts/compare_snapshots.py
      - name: Validate and publish relationships
        run: python scripts/build_relationships.py
      - name: Derive portfolio review obligations
        run: python scripts/build_impacts.py
      - name: Evaluate evidence policies and publish findings
        run: python scripts/build_findings.py
      - name: Validate and publish external dependencies
        run: python scripts/build_external_dependencies.py
      - name: Update findings lifecycle and weekly report
        run: python scripts/build_lifecycle_report.py
      - name: Build portfolio assurance dashboard
        run: python scripts/build_site.py
      - name: Build broader observation horizons
        run: python scripts/build_observation_horizons.py
      - name: Advance persistent state
        run: |
          mkdir -p .state
          cp reports/latest/portfolio.json .state/portfolio.json
          cp site/findings-lifecycle.json .state/findings-lifecycle.json
      - name: Save current portfolio state
        uses: actions/cache/save@v4
        with:
          path: .state
          key: portfolio-baseline-${{ github.run_id }}
      - name: Upload portfolio evidence
        uses: actions/upload-artifact@v4
        with:
          name: uncefact-portfolio-evidence
          path: |
            reports/latest/portfolio.json
            reports/latest/changes.json
            site/relationships.json
            site/relationships.mmd
            site/impacts.json
            site/findings.json
            site/findings-lifecycle.json
            site/external-dependencies.json
            site/observation-horizons.json
            site/weekly-report.md
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: discover-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
